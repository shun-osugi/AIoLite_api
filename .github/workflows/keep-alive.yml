# ワークフローの名前
name: Renderサービス常時起動

# ワークフローが実行されるタイミングを定義
on:
  schedule:
    # cron形式で10分ごとに実行 (*_/_10 * * * *)
    # UTC（協定世界時）基準であることに注意
    - cron: '*/10 * * * *'
  # 手動での実行も可能にする
  workflow_dispatch:

# 実行するジョブを定義
jobs:
  # ジョブID（任意の名前）
  ping:
    # 実行環境を指定
    runs-on: ubuntu-latest
    
    # 実行するステップを定義
    steps:
      # ステップの名前
      - name: RenderのURLにリクエストを送信
        # 実行するコマンド
        # --fail オプションは、HTTPステータスコードが4xxや5xxの場合にエラーとして扱うため、
        # サービスが正常に応答しない場合にワークフローが失敗し、通知を受け取れます。
        run: curl --fail ${{ secrets.RENDER_URL }}